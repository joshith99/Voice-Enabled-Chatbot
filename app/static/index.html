<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Sarcastic Therapist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-emoji" aria-hidden="true">🛋️</span>
        <div class="brand-text">
          <h1>Your Sarcastic Therapist</h1>
          <p class="tagline">Certified in vibes. Not in actual therapy.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="new-chat" id="newChatBtn" type="button">New chat</button>
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
      <div class="bubble bot">
        <div class="bubble-label">Therapist</div>
        <div class="bubble-body">Hey. Talk to me. I'll pretend to care professionally while judging you supportively.</div>
        <div class="bubble-caption">Speak with the mic, or type below.</div>
      </div>
    </main>

    <div class="notice hidden" id="notice" role="alert"></div>

    <footer class="composer">
      <button class="mic" id="micBtn" type="button" title="Hold a conversation, not your feelings" aria-label="Record voice">
        <span class="mic-icon" aria-hidden="true">🎙️</span>
        <span class="mic-text" id="micText">Talk</span>
      </button>
      <form class="text-form" id="textForm" autocomplete="off">
        <input
          type="text"
          id="textInput"
          class="text-input"
          placeholder="Or type here, coward..."
          aria-label="Type a message"
        />
        <button class="send" id="sendBtn" type="submit">Send</button>
      </form>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
