<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Your Sarcastic Therapist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>" />
  <script>
    /* Set the theme before first paint so there is no flash of the wrong one. */
    (function () {
      try {
        var saved = localStorage.getItem("myra.theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18" />
            <path d="M5 6h14" />
            <path d="M7 6 4 13h6L7 6z" />
            <path d="M17 6l-3 7h6l-3-7z" />
            <path d="M8 21h8" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>Your Sarcastic Therapist</h1>
          <p class="tagline">Certified in vibes. Not in actual therapy.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="themeBtn" type="button" aria-label="Switch theme" aria-pressed="false" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <button class="new-chat" id="newChatBtn" type="button">New chat</button>
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Ready</span>
        </div>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
      <div class="bubble bot">
        <div class="bubble-label">Therapist</div>
        <div class="bubble-body">Hey. Talk to me. I'll pretend to care professionally while judging you supportively.</div>
        <div class="bubble-caption">Speak with the mic, or type below.</div>
      </div>
    </main>

    <div class="notice hidden" id="notice" role="alert"></div>

    <footer class="composer">
      <button class="mic" id="micBtn" type="button" title="Hold a conversation, not your feelings" aria-label="Record voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <path d="M12 18v3" />
        </svg>
        <span class="mic-text" id="micText">Talk</span>
      </button>
      <form class="text-form" id="textForm" autocomplete="off">
        <input
          type="text"
          id="textInput"
          class="text-input"
          placeholder="Or type here, coward..."
          aria-label="Type a message"
        />
        <button class="send" id="sendBtn" type="submit">Send</button>
      </form>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
